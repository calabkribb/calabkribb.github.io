project:
  type: website
  output-dir: docs          # GitHub Pages가 읽을 폴더
  resources:
    - .nojekyll             # GitHub Pages의 Jekyll 처리 끄기 (render 때마다 docs/로 복사)

lang: en

website:
  title: "Cellular Agenomics Lab"
  site-url: "https://calabkribb.github.io"   # sitemap.xml 생성에 필요
  description: "Cellular Agenomics Lab (CALab) at KRIBB"
  search: false             # 메뉴바 검색 아이콘 숨김
  page-footer:
    left: "© 2020–2026 Cellular Agenomics Lab · [KRIBB](https://www.kribb.re.kr)"
    right:
      - icon: envelope
        href: "mailto:kimchuna@kribb.re.kr"
  # 상단 메뉴바: 왼쪽 로고+연구실 이름, 오른쪽 메뉴 (caojunyuelab.org 스타일)
  navbar:
    logo: assets/logo.png
    title: "Cellular Agenomics Lab"
    background: light
    collapse-below: xl      # 메뉴 8개라 1200px 미만에서는 햄버거 메뉴로 접음 (그보다 좁으면 메뉴가 여러 줄로 깨짐)
    right:
      - text: Research
        href: research.qmd
      - text: Models & Tools
        href: methods.qmd
      - text: Team
        href: team.qmd
      - text: Publications
        href: publications.qmd
      - text: News
        href: news.qmd
      - text: Photos
        href: photos.qmd
      - text: Outreach
        href: outreach.qmd
      - text: Join us
        href: join.qmd

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    page-layout: full   # 모든 페이지 양옆 여백 없이 전체 폭 사용 (2026-10-26)
