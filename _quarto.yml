project:
  type: website
  output-dir: docs          # GitHub Pages가 읽을 폴더
  resources:
    - .nojekyll             # GitHub Pages의 Jekyll 처리 끄기 (render 때마다 docs/로 복사)

lang: ko                    # 기본 언어. 영어는 각 페이지의 English 탭으로 제공
date-modified: last-modified  # 페이지 상단에 최종 수정일 표시
language:
  title-block-modified: "최종 수정 · Last modified"  # Quarto 한국어 번역에 이 항목이 없어 직접 지정

website:
  title: "CALab"
  site-url: "https://calabkribb.github.io"   # sitemap.xml 생성에 필요
  description: "Cellular Aging Laboratory (CALab), KRIBB — 세포노화 연구실"
  page-footer: "© 2026 CALab · [KRIBB](https://www.kribb.re.kr)"
  sidebar:
    style: docked
    logo: assets/logo.png
    title: "CALab"
    header: "**Cellular Aging Laboratory**<br>세포노화 연구실 · KRIBB"
    contents:
      - text: "홈 · Home"
        href: index.qmd
      - text: "연구 · Research"
        href: research/index.qmd
      - text: "구성원 · Team"
        href: team.qmd
      - text: "논문 · Publications"
        href: publications.qmd
      - text: "소식 · News"
        href: news.qmd
      - text: "합류 · Join"
        href: join.qmd
    tools:
      - icon: envelope
        href: "mailto:pi-email@example.com"
      - icon: github
        href: "https://github.com/calabkribb"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
