# Models & Tools 페이지의 반복 데이터 (R/site.R의 show_cards(), paper_list()가 읽음).
# 섹션 제목·문단·그림은 methods.qmd에 직접 씀.
# icon: assets/methods/icons/<이름>.webp (장식용, alt 없음)
# tags: label(화면 글자)과 kind(색). kind = rna, space, protein, metabolite, house, collab
#       (색은 Research 그림의 데이터 층 색과 맞춤. 협력 기관·연구자 이름은 쓰지 않음)
# papers: 서지정보는 PubMed 기준 (PMID 40325195, 39797734, 35776635). 제목 끝 마침표 없음

data_cards:
  - icon: singlecell
    title: "Single-cell & single-nucleus"
    tags: [{label: "RNA · Chromatin", kind: rna}, {label: "In-house", kind: house}]
    text: "scRNA-seq, snRNA-seq and scATAC-seq on 10x Genomics Chromium, and single-cell combinatorial indexing (sci) for scalable profiling."
  - icon: bulk
    title: "Bulk sequencing"
    tags: [{label: "RNA · Chromatin", kind: rna}, {label: "In-house", kind: house}]
    text: "Bulk RNA-seq and ATAC-seq, sequenced on Illumina NovaSeq."
  - icon: longread
    title: "Long-read sequencing"
    tags: [{label: "RNA isoforms", kind: rna}, {label: "In-house", kind: house}]
    text: "Nanopore long-read sequencing (P2 Solo) to resolve RNA isoforms and alternative splicing, and genome structural variants."
  - icon: spatial
    title: "Spatial transcriptomics · Xenium"
    tags: [{label: "Space", kind: space}, {label: "In-house", kind: house}]
    text: "10x Genomics Xenium in situ imaging to place cell states in their tissue niche."
  - icon: protein
    title: "Proteomics"
    tags: [{label: "Protein", kind: protein}, {label: "Collaboration", kind: collab}]
    text: "Mass-spectrometry proteomics (LC-MS/MS) of tissues and niche fractions."
  - icon: metabolite
    title: "Metabolomics"
    tags: [{label: "Metabolite", kind: metabolite}, {label: "Collaboration", kind: collab}]
    text: "Metabolite profiling to follow metabolic rewiring with age."

assay_cards:
  - icon: screen
    title: "Genetic screening"
    text: "CRISPR, CRISPRa and ORFeome screens to find factors that set or reverse the senescence fate."
  - icon: molecular
    title: "Molecular tools"
    text: "Cloning and lentiviral vectors to perturb and track genes."
  - icon: readout
    title: "Molecular assays"
    text: "Real-time PCR and Western blot to measure gene and protein expression."
  - icon: tissue
    title: "Tissue validation"
    text: "Histology and immunofluorescence, RNA FISH (e.g. RNAscope) and telomere FISH to confirm cell states in tissue."

papers:
  fini:
    - title: "Quasi-spatial single-cell transcriptome based on physical tissue properties defines early aging associated niche in liver"
      authors: "Tak et al."
      journal: "Nature Aging"
      year: 2025
      doi: "10.1038/s43587-025-00857-7"
  computation:
    - title: "GDBr: genomic signature interpretation tool for DNA double-strand break repair mechanisms"
      authors: "Ryu et al."
      journal: "Nucleic Acids Research"
      year: 2025
      doi: "10.1093/nar/gkae1295"
    - title: "A beginner's guide to assembling a draft genome and analyzing structural variants with long-read sequencing technologies"
      authors: "Kim et al."
      journal: "STAR Protocols"
      year: 2022
      doi: "10.1016/j.xpro.2022.101506"
