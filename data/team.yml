# 구성원 데이터. team.qmd가 이 파일을 읽어 한국어/English 탭을 자동 생성함.
# 모든 값은 placeholder. 사진은 본인 동의를 받은 것만 사용 (CLAUDE.md 규칙 6).
# 각 항목의 ko/en은 탭별로 표시될 텍스트.

pi:
  name:  {ko: "PI 이름", en: "PI Name"}
  title: {ko: "책임연구원 / 연구실장", en: "Principal Investigator"}
  photo: assets/logo.png
  orcid: ""   # 예: "0000-0002-1234-5678". 비어 있으면 ORCID 링크를 표시하지 않음
  email: "pi-email@example.com"
  bio:
    ko: "세포노화와 노화 미세환경을 단일세포·공간 멀티오믹스로 연구합니다. (소개 2~3문장 작성 예정)"
    en: "Studies cellular senescence and aging microenvironments with single-cell and spatial multi-omics. (2–3 sentence bio to be written)"
  # period가 "–"로 끝나면 재직 중 → 탭에 따라 "현재"/"present" 자동 표시
  career:
    - {period: "20XX–", ko: "한국생명공학연구원(KRIBB) 책임연구원", en: "Principal Researcher, KRIBB"}
    - {period: "20XX–20XX", ko: "기관명, 직위", en: "Position, Institution"}
  awards:
    - {period: "20XX", ko: "수상명", en: "Award name"}
  service:
    - {period: "20XX–", ko: "학회·위원회명, 역할", en: "Committee / society, role"}

members:
  - name:      {ko: "구성원 A", en: "Member A"}
    role:      {ko: "박사후연구원", en: "Postdoctoral Researcher"}
    interests: {ko: "연구 관심사 한 줄", en: "One-line research interest"}
    photo: assets/logo.png
    orcid: ""
    status: current
  - name:      {ko: "구성원 B", en: "Member B"}
    role:      {ko: "박사과정", en: "PhD Student"}
    interests: {ko: "연구 관심사 한 줄", en: "One-line research interest"}
    photo: assets/logo.png
    orcid: ""
    status: current
  - name:      {ko: "구성원 C", en: "Member C"}
    role:      {ko: "연구원", en: "Researcher"}
    interests: {ko: "연구 관심사 한 줄", en: "One-line research interest"}
    photo: assets/logo.png
    orcid: ""
    status: current
  # 졸업생: status: alumni, period(재직 기간), now(현재 소속) 필수
  - name:  {ko: "졸업생 D", en: "Alumnus D"}
    role:  {ko: "석사과정", en: "MS Student"}
    now:   {ko: "현재 소속", en: "Current position"}
    period: "20XX–20XX"
    photo: assets/logo.png
    orcid: ""
    status: alumni
