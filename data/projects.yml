# Research 페이지 데이터 (R/site.R의 show_projects()가 읽음). 위에서부터 Theme 1, 2, 3 순서로 표시.
# id: 페이지 안 바로가기 주소 (영문 소문자·하이픈)
# question: 핵심 질문 (강조 표시) / what_we_do: "What we do" 칸 문장
# figure / alt: 주제 그림 (assets/research/)과 대체 텍스트
# papers: Key papers. 서지정보는 PubMed 기준 (2026-10-19 확인). 제목 끝 마침표는 붙이지 않음
# funding: 연구비. 과제번호가 정해지기 전에는 비워 둠 ([] → 화면에 표시 안 함)
#          예: - "National Research Foundation of Korea (NRF), RS-0000-00000000"

- id: aging-environments
  title: "Aging environments"
  question: "Which tissue environments make cells age? In which organs — and in what order — do aging microenvironments emerge?"
  what_we_do: "We build single-cell multi-omic atlases to determine the order in which organs age and the changes that arise along the way."
  figure: assets/research/research_theme1.webp
  alt: "Young, middle-aged and old human bodies drawn as mosaics whose aging patches increase with age, with the order of organ aging marked as unknown; curves showing non-linear change with age; liver tissue patches forming a mosaic of aging regions; and a senescent niche."
  papers:
    - title: "Quasi-spatial single-cell transcriptome based on physical tissue properties defines early aging associated niche in liver"
      authors: "Tak et al."
      journal: "Nature Aging"
      year: 2025
      doi: "10.1038/s43587-025-00857-7"
    - title: "Transcriptomic Analysis of Cellular Senescence: One Step Closer to Senescence Atlas"
      authors: "Kim et al."
      journal: "Molecules and Cells"
      year: 2021
      doi: "10.14348/molcells.2021.2239"
  funding: []   # NRF — 과제번호 미정

- id: cell-fate-decisions
  title: "Cell-fate decisions"
  question: "How does a cell integrate gene regulation, signaling and metabolism to choose senescence over other fates?"
  what_we_do: "We follow cells longitudinally as they age, in cell and animal models, to define how the senescence fate decision is made, and we run genetic screens for factors that can reverse it."
  figure: assets/research/research_theme2.webp
  alt: "A cell receives ECM, SASP, metabolic and damage inputs; chromatin and RNA isoforms, protein signaling and a rewired metabolic circuit lead to proliferation, quiescence, apoptosis, ferroptosis or senescence, which is either transient and cleared or persistent and accumulating."
  papers:
    - title: "Distinct characteristics of two types of alternative lengthening of telomeres in mouse embryonic stem cells"
      authors: "Sung et al."
      journal: "Nucleic Acids Research"
      year: 2023
      doi: "10.1093/nar/gkad617"
    - title: "Telomeres reforged with non-telomeric sequences in mouse embryonic stem cells"
      authors: "Kim et al."
      journal: "Nature Communications"
      year: 2021
      doi: "10.1038/s41467-021-21341-x"
  funding: []   # NRF — 과제번호 미정

- id: fate-to-disease
  title: "From fate to disease"
  question: "How do these fate decisions feed back to build fibrotic, inflamed and declining tissues?"
  what_we_do: "We model imperfect repair to understand, at spatial single-cell resolution, how aging microenvironments form."
  figure: assets/research/research_theme3.webp
  alt: "Repeated damage creates senescent cells; immune clearance leads back to repair, whereas immune evasion leads to matrix memory, senescent burden, regenerative failure and somatic clonal expansion, which drive fibrosis, inflammation, cancer and clonal hematopoiesis."
  papers:
    - title: "Imperfect repair in aging: senescent cells and the hepatic fibrotic niche"
      authors: "Kim et al."
      journal: "BMB Reports"
      year: 2026
      doi: "10.5483/BMBRep.2025-0224"
    - title: "Neutrophil-derived itaconate facilitates tiered pulmonary inflammation via Kdm5b-associated epigenetic remodeling in alveolar macrophages"
      authors: "Lim et al."
      journal: "Cell Reports"
      year: 2026
      doi: "10.1016/j.celrep.2026.117412"
  funding: []   # NRF — 과제번호 미정
